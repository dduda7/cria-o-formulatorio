<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição de Filmes</title>
    <link rel="stylesheet" href="./css/formulario.css">
</head>
<body>

    <div class="container">
        <h1>Ingresso para Filmes</h1>
        <p>Faça sua inscrição!</p>
        <hr>

        <form>
            <div class="form-control">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>
            </div>

            <div class="form-control">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       placeholder="Digite seu e-mail" required>
            </div>

            <div class="form-control">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="Digite seu telefone" required>
            </div>

            <div class="form-control">
                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="form-control">
                <label for="senha"> Senha:</label>
                <input type="password" id="senha" name="senha"
                       placeholder="Crie uma senha" required>
            </div>

            <div class="form-control">
                <label for="filme">Gênero de filme favorito:</label>
                <select id="filme" name="filme" required>
                    <option value="">Selecione um gênero</option>
                    <option value="acao">Ação</option>
                    <option value="comedia">Comédia</option>
                    <option value="terror">Terror</option>
                    <option value="romance">Romance</option>
                    <option value="aventura">Aventura</option>
                    <option value="ficcao">Ficção científica</option>
                </select>
            </div>

            <div class="form-control">
                <button type="submit" class="btn-cadastro">
                    Entrar
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar
                </button>
            </div>
        </form>

        <p class="rodape">Prepare a pipoca e aproveite o filme!</p>

        <a href="esqueciSenha.html">Esqueci a senha</a>

     </div>
</body>
</html>
